name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      # The unit tests, the generator driven as a binary, the committed
      # generated tree compiled and run, and the cross-SDK wire vectors.
      - name: cargo test
        run: cargo test

      # The fixture tree under tests/fixtures/ is committed and compiled by
      # tests/generated.rs, so it has to be what the generator writes today.
      # `--check` writes nothing and fails if it is not.
      - name: the committed Rust fixture is current
        working-directory: tests/fixtures
        run: cargo run --quiet --bin fomoxac -- generate --check

      # The Go fixture has no Rust test that compiles it (`cargo test` never
      # invokes the Go toolchain), so both checks live here: current, and
      # actually buildable.
      - name: the committed Go fixture is current
        working-directory: tests/fixtures-go
        run: cargo run --quiet --bin fomoxac -- generate --check

      - name: the committed Go fixture builds and vets clean
        working-directory: tests/fixtures-go
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go build ./...
          go vet ./...

      - name: the committed Go vector tree is current
        working-directory: tests/vectors-go
        run: cargo run --quiet --bin fomoxac -- generate --check

      - name: the Go codecs reproduce tests/vectors/fomoxa-vectors.json
        working-directory: tests/vectors-go
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go run .

      - name: the Go codecs reproduce the vectors where int is 32 bits
        working-directory: tests/vectors-go
        run: |
          GOARCH=386 go vet ./...
          GOARCH=386 go build -o /tmp/fomoxa-go-vectors-386 .
          /tmp/fomoxa-go-vectors-386

      # Same shape as the Go fixture above: current, and actually buildable.
      # `cargo test` never invokes the .NET SDK either.
      - name: the committed C# fixture is current
        working-directory: tests/fixtures-cs
        run: cargo run --quiet --bin fomoxac -- generate --check

      - name: the committed C# fixture builds clean
        working-directory: tests/fixtures-cs
        run: dotnet build --nologo

      - name: the committed C# vector tree is current
        working-directory: tests/vectors-cs
        run: cargo run --quiet --bin fomoxac -- generate --check

      - name: the C# codecs reproduce tests/vectors/fomoxa-vectors.json
        working-directory: tests/vectors-cs
        run: dotnet run

      # Same shape as the Go and C# fixtures above: current, and actually
      # buildable - g++ is available on the standard Ubuntu runner image, so
      # this one gets a real compile and a real run.
      - name: the committed C++ fixture is current
        working-directory: tests/fixtures-cpp
        run: cargo run --quiet --bin fomoxac -- generate --check

      - name: the committed C++ fixture builds and its smoke test round-trips
        working-directory: tests/fixtures-cpp
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -I . -I include -I src \
            smoke_test.cpp -o /tmp/fomoxa-cpp-smoke-test
          /tmp/fomoxa-cpp-smoke-test

      - name: the committed C++ vector tree is current
        working-directory: tests/vectors-cpp
        run: cargo run --quiet --bin fomoxac -- generate --check

      - name: the C++ codecs reproduce tests/vectors/fomoxa-vectors.json
        working-directory: tests/vectors-cpp
        run: |
          set -o pipefail
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I ../sdk/c/include -c ../sdk/c/src/schema.c -o /tmp/fomoxa-sdk-schema.o
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I . -I include -I src -I ../sdk/c/include \
            vectors_test.cpp /tmp/fomoxa-sdk-schema.o -o /tmp/fomoxa-cpp-vectors
          python3 ../vectors/lines.py | /tmp/fomoxa-cpp-vectors

      # gcc is available on the same runner image, so the C backend gets the
      # same real compile-and-run treatment as C++'s, above.
      - name: the committed C fixture is current
        working-directory: tests/fixtures-c
        run: cargo run --quiet --bin fomoxac -- generate --check

      - name: the committed C fixture builds and its smoke test round-trips
        working-directory: tests/fixtures-c
        run: |
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror \
            -I . -I include -I src \
            smoke_test.c -o /tmp/fomoxa-c-smoke-test
          /tmp/fomoxa-c-smoke-test

      - name: the committed C vector tree is current
        working-directory: tests/vectors-c
        run: cargo run --quiet --bin fomoxac -- generate --check

      - name: the C codecs reproduce tests/vectors/fomoxa-vectors.json
        working-directory: tests/vectors-c
        run: |
          set -o pipefail
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -I . -I include -I src -I ../sdk/c/include \
            vectors_test.c ../sdk/c/src/schema.c -o /tmp/fomoxa-c-vectors
          python3 ../vectors/lines.py | /tmp/fomoxa-c-vectors

      # Same shape as the Go and C# fixtures above: current, and actually
      # buildable - `tsc` is installed from the fixture's own package.json,
      # so the generated tree is real-world type-checked, not just
      # freshness-checked.
      - name: the committed TypeScript fixture is current
        working-directory: tests/fixtures-ts
        run: cargo run --quiet --bin fomoxac -- generate --check

      - name: the committed TypeScript fixture builds and its smoke test round-trips
        working-directory: tests/fixtures-ts
        run: |
          npm install
          npx tsc -p tsconfig.json
          node dist/smoke_test.js
          node dist/vectors_test.js

      # JavaScript needs no build step at all - the generated tree is run
      # directly by Node's own ESM loader, which is also why every relative
      # import the JavaScript backend writes carries an explicit `.js`
      # extension (see generator::javascript's module docs).
      - name: the committed JavaScript fixture is current
        working-directory: tests/fixtures-js
        run: cargo run --quiet --bin fomoxac -- generate --check

      - name: the committed JavaScript fixture's smoke test round-trips
        working-directory: tests/fixtures-js
        run: node smoke_test.js

      - name: the JavaScript codecs reproduce tests/vectors/fomoxa-vectors.json
        working-directory: tests/fixtures-js
        run: |
          npm install
          node vectors_test.js
