[package]
name = "fomoxac"
version = "0.2.1"
edition = "2021"
description = "The official Fomoxa source generator: reads Fomoxa attributes, writes one codec file per model/codec, and emits the schema, fingerprints and build graph that go with them."
license = "Apache-2.0"
keywords = ["fomoxa", "codegen", "source-generator", "codec", "binary"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"
repository = "https://github.com/fomoxa/fomoxac"
homepage = "https://fomoxa.github.io"

[lib]
name = "fomoxac"
path = "src/lib.rs"

[[bin]]
name = "fomoxac"
path = "src/bin/fomoxac.rs"

[[bin]]
name = "fomoxa-inspect"
path = "src/bin/fomoxa_inspect.rs"

# No dependencies, and none are wanted - not in the generator, and not in what
# it generates. `fomoxac` does not parse Rust; it looks for four markers and
# writes call sites (see `parser/rust.rs`). SHA-256, JSON and the TOML subset it
# needs are each a few dozen lines, written here so that the fingerprint
# algorithm has no version to drift with.

# Test-only, and only for one reason: `tests/fixtures/models/` is annotated
# source, and `#[network]` has to exist for `rustc` to accept it. The fixture is
# a real project - one model, annotated in place, with the generated codecs
# compiled against that same type - and it could not be that without this.
# `fomoxac` itself, and everything it writes, still depends on nothing.
[dev-dependencies]
fomoxa-attributes = "0.1.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
